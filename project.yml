name: Splitway
options:
  bundleIdPrefix: com.facelessdiplomat
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SPLITWAY_BUNDLE_ID_PREFIX: com.facelessdiplomat
    SPLITWAY_UPDATE_FEED_URL: https://github.com/facelessdiplomat/splitway/releases/latest/download/appcast.xml
    SPLITWAY_UPDATE_PUBLIC_KEY: 4Qdz/CnCaYgplMJWnHwupw108iZwiI5aQeZg8Imu4fE=
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "6.0"
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    DEVELOPMENT_TEAM: 8625S77CSU
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
packages:
  SplitwayKit:
    path: Packages/SplitwayKit
  TunnelCore:
    path: Packages/TunnelCore
targets:
  macOSApp:
    type: application
    platform: macOS
    sources:
      - path: Apps/macOSApp
      - path: Apps/Shared
    settings:
      base:
        PRODUCT_NAME: Splitway
        PRODUCT_BUNDLE_IDENTIFIER: $(SPLITWAY_BUNDLE_ID_PREFIX).splitway
        CODE_SIGN_ENTITLEMENTS: Apps/macOSApp/macOSApp.entitlements
        INFOPLIST_FILE: Apps/macOSApp/Info.plist
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        INFOPLIST_KEY_CFBundleDisplayName: Splitway
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright © 2026 facelessdiplomat
      configs:
        Debug:
          SPLITWAY_STARTS_UPDATER: NO
        Release:
          SPLITWAY_STARTS_UPDATER: YES
    dependencies:
      - target: NetworkSystemExtension
      - package: SplitwayKit
        product: MenuBarPresentation
      - package: SplitwayKit
        product: MenuBarInfrastructure
      - package: SplitwayKit
        product: TunnelLibraryPresentation
      - package: SplitwayKit
        product: TunnelLibraryInfrastructure
      - package: SplitwayKit
        product: TunnelConnectionInfrastructure
      - package: SplitwayKit
        product: Shortcuts
      - package: SplitwayKit
        product: TunnelConnectionPresentation
      - package: SplitwayKit
        product: TunnelImportPresentation
      - package: SplitwayKit
        product: TunnelImportInfrastructure
      - package: SplitwayKit
        product: TunnelEditorPresentation
      - package: SplitwayKit
        product: ApplicationCatalogPresentation
      - package: SplitwayKit
        product: ApplicationCatalogInfrastructure
      - package: SplitwayKit
        product: DiagnosticsInfrastructure
      - package: SplitwayKit
        product: DiagnosticsPresentation
      - package: SplitwayKit
        product: SettingsInfrastructure
      - package: SplitwayKit
        product: SettingsPresentation
      - package: SplitwayKit
        product: UpdatesInfrastructure
      - package: SplitwayKit
        product: UpdatesPresentation
      - package: SplitwayKit
        product: OnboardingInfrastructure
      - package: SplitwayKit
        product: OnboardingPresentation
      - package: SplitwayKit
        product: SystemExtensionPresentation
      - package: SplitwayKit
        product: SystemExtensionInfrastructure
      - package: SplitwayKit
        product: SecretDelivery
      - package: SplitwayKit
        product: SecretDeliveryInfrastructure
    scheme: {}
  NetworkSystemExtension:
    type: system-extension
    platform: macOS
    sources:
      - path: Apps/NetworkSystemExtension
      - path: Apps/SharedTunnelProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SPLITWAY_BUNDLE_ID_PREFIX).splitway.network-extension
        PRODUCT_NAME: $(PRODUCT_BUNDLE_IDENTIFIER)
        PRODUCT_MODULE_NAME: NetworkSystemExtension
        INFOPLIST_FILE: Apps/NetworkSystemExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: Apps/NetworkSystemExtension/NetworkSystemExtension.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
        INFOPLIST_KEY_CFBundleDisplayName: Splitway Network Extension
    dependencies:
      - package: SplitwayKit
        product: PacketTunnel
      - package: SplitwayKit
        product: PacketTunnelInfrastructure
      - package: SplitwayKit
        product: ProviderMessaging
      - package: SplitwayKit
        product: Diagnostics
      - package: SplitwayKit
        product: DiagnosticsInfrastructure
      - package: SplitwayKit
        product: SecretDelivery
      - package: SplitwayKit
        product: TransparentProxy
      - package: SplitwayKit
        product: TransparentProxyInfrastructure
      - package: SplitwayKit
        product: SecretDeliveryInfrastructure
      - package: TunnelCore
        product: TunnelCoreAdapter
  IntegrationTestHost:
    type: application
    platform: macOS
    sources:
      - path: IntegrationTestHost
    settings:
      base:
        PRODUCT_NAME: SplitwayIntegrationTestHost
        PRODUCT_BUNDLE_IDENTIFIER: $(SPLITWAY_BUNDLE_ID_PREFIX).splitway.integration-test-host
        CODE_SIGN_ENTITLEMENTS: IntegrationTestHost/IntegrationTestHost.entitlements
        INFOPLIST_FILE: IntegrationTestHost/Info.plist
    scheme:
      testTargets:
        - macOSIntegrationTests
  macOSIntegrationTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: IntegrationTests
    dependencies:
      - target: IntegrationTestHost
      - package: SplitwayKit
        product: TunnelLibrary
      - package: SplitwayKit
        product: TunnelLibraryInfrastructure
      - package: SplitwayKit
        product: TunnelImport
      - package: SplitwayKit
        product: TunnelImportInfrastructure
      - package: SplitwayKit
        product: TunnelConnection
      - package: SplitwayKit
        product: ProviderMessaging
      - package: SplitwayKit
        product: Diagnostics
      - package: SplitwayKit
        product: DiagnosticsInfrastructure
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SPLITWAY_BUNDLE_ID_PREFIX).splitway.integration-tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/SplitwayIntegrationTestHost.app/Contents/MacOS/SplitwayIntegrationTestHost
        BUNDLE_LOADER: $(TEST_HOST)
