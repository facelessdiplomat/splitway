name: Bug report
description: Something in Splitway does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Issues are public. Never paste WireGuard configurations, keys or crash reports here, and report security problems privately through the Security tab.
  - type: input
    id: version
    attributes:
      label: Splitway version
      description: Settings › About
      placeholder: 1.0 (500)
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "26.1"
    validations:
      required: true
  - type: dropdown
    id: routing
    attributes:
      label: Routing mode of the tunnel
      options:
        - All traffic
        - Selected apps
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What did you do?
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
