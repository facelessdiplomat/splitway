name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: [self-hosted, macOS, splitway]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: Scripts/release.sh "${GITHUB_REF_NAME#v}" --publish
        env:
          GH_TOKEN: ${{ github.token }}
