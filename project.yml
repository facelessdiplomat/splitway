name: Splitway
options:
  bundleIdPrefix: com.facelessdiplomat
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SPLITWAY_BUNDLE_ID_PREFIX: com.facelessdiplomat
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "6.0"
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    DEVELOPMENT_TEAM: 8625S77CSU
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
  configs:
    Debug:
      SPLITWAY_NETWORK_EXTENSION_ENTITLEMENT_SUFFIX: ""
    Release:
      SPLITWAY_NETWORK_EXTENSION_ENTITLEMENT_SUFFIX: -systemextension
packages:
  SplitwayKit:
    path: Packages/SplitwayKit
  TunnelCore:
    path: Packages/TunnelCore
targets:
  iOSApp:
    type: application
    platform: iOS
    sources:
      - path: Apps/iOSApp
      - path: Apps/Shared
      - path: Apps/SharedControls
    settings:
      base:
        PRODUCT_NAME: Splitway
        PRODUCT_BUNDLE_IDENTIFIER: $(SPLITWAY_BUNDLE_ID_PREFIX).splitway
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: Apps/iOSApp/iOSApp.entitlements
        INFOPLIST_FILE: Apps/iOSApp/Info.plist
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        INFOPLIST_KEY_CFBundleDisplayName: Splitway
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    dependencies:
      - target: PacketTunnelExtension
      - target: ControlsExtension
      - package: SplitwayKit
        product: TunnelLibraryPresentation
      - package: SplitwayKit
        product: TunnelLibraryInfrastructure
      - package: SplitwayKit
        product: TunnelConnectionInfrastructure
      - package: SplitwayKit
        product: Shortcuts
      - package: SplitwayKit
        product: TunnelConnectionPresentation
      - package: SplitwayKit
        product: TunnelImportPresentation
      - package: SplitwayKit
        product: TunnelImportInfrastructure
      - package: SplitwayKit
        product: TunnelEditorPresentation
      - package: SplitwayKit
        product: ServiceCatalog
      - package: SplitwayKit
        product: ServiceCatalogInfrastructure
      - package: SplitwayKit
        product: ServiceCatalogPresentation
      - package: SplitwayKit
        product: ApplicationCatalogPresentation
      - package: SplitwayKit
        product: DiagnosticsInfrastructure
      - package: SplitwayKit
        product: DiagnosticsPresentation
      - package: SplitwayKit
        product: SettingsInfrastructure
      - package: SplitwayKit
        product: SettingsPresentation
      - package: SplitwayKit
        product: OnboardingInfrastructure
      - package: SplitwayKit
        product: OnboardingPresentation
      - package: SplitwayKit
        product: SystemExtensionPresentation
    scheme:
      testTargets:
        - iOSIntegrationTests
  PacketTunnelExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Apps/PacketTunnelExtension
      - path: Apps/SharedTunnelProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SPLITWAY_BUNDLE_ID_PREFIX).splitway.packet-tunnel
        INFOPLIST_FILE: Apps/PacketTunnelExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: Apps/PacketTunnelExtension/PacketTunnelExtension.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Splitway Tunnel
    dependencies:
      - package: SplitwayKit
        product: PacketTunnel
      - package: SplitwayKit
        product: PacketTunnelInfrastructure
      - package: SplitwayKit
        product: ProviderMessaging
      - package: SplitwayKit
        product: TunnelLibraryInfrastructure
      - package: SplitwayKit
        product: ServiceCatalog
      - package: SplitwayKit
        product: ServiceCatalogInfrastructure
      - package: SplitwayKit
        product: Diagnostics
      - package: SplitwayKit
        product: DiagnosticsInfrastructure
      - package: TunnelCore
        product: TunnelCoreAdapter
  ControlsExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Apps/ControlsExtension
      - path: Apps/SharedControls
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SPLITWAY_BUNDLE_ID_PREFIX).splitway.controls
        INFOPLIST_FILE: Apps/ControlsExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: Apps/ControlsExtension/ControlsExtension.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Splitway Controls
  iOSIntegrationTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: IntegrationTests
    dependencies:
      - target: iOSApp
      - package: SplitwayKit
        product: TunnelLibraryInfrastructure
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SPLITWAY_BUNDLE_ID_PREFIX).splitway.integration-tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Splitway.app/Splitway
  iOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: iOSApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SPLITWAY_BUNDLE_ID_PREFIX).splitway.ui-tests
        TEST_TARGET_NAME: iOSApp
  macOSApp:
    type: application
    platform: macOS
    sources:
      - path: Apps/macOSApp
      - path: Apps/Shared
    settings:
      base:
        PRODUCT_NAME: Splitway
        PRODUCT_BUNDLE_IDENTIFIER: $(SPLITWAY_BUNDLE_ID_PREFIX).splitway
        CODE_SIGN_ENTITLEMENTS: Apps/macOSApp/macOSApp.entitlements
        INFOPLIST_FILE: Apps/macOSApp/Info.plist
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ENABLE_HARDENED_RUNTIME: YES
        INFOPLIST_KEY_CFBundleDisplayName: Splitway
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright © 2026 facelessdiplomat
    dependencies:
      - target: NetworkSystemExtension
      - package: SplitwayKit
        product: MenuBarPresentation
      - package: SplitwayKit
        product: MenuBarInfrastructure
      - package: SplitwayKit
        product: TunnelLibraryPresentation
      - package: SplitwayKit
        product: TunnelLibraryInfrastructure
      - package: SplitwayKit
        product: TunnelConnectionInfrastructure
      - package: SplitwayKit
        product: Shortcuts
      - package: SplitwayKit
        product: TunnelConnectionPresentation
      - package: SplitwayKit
        product: TunnelImportPresentation
      - package: SplitwayKit
        product: TunnelImportInfrastructure
      - package: SplitwayKit
        product: TunnelEditorPresentation
      - package: SplitwayKit
        product: ServiceCatalogPresentation
      - package: SplitwayKit
        product: ApplicationCatalogPresentation
      - package: SplitwayKit
        product: ApplicationCatalogInfrastructure
      - package: SplitwayKit
        product: DiagnosticsInfrastructure
      - package: SplitwayKit
        product: DiagnosticsPresentation
      - package: SplitwayKit
        product: SettingsInfrastructure
      - package: SplitwayKit
        product: SettingsPresentation
      - package: SplitwayKit
        product: OnboardingInfrastructure
      - package: SplitwayKit
        product: OnboardingPresentation
      - package: SplitwayKit
        product: SystemExtensionPresentation
      - package: SplitwayKit
        product: SystemExtensionInfrastructure
      - package: SplitwayKit
        product: SecretDelivery
      - package: SplitwayKit
        product: SecretDeliveryInfrastructure
    scheme: {}
  NetworkSystemExtension:
    type: system-extension
    platform: macOS
    sources:
      - path: Apps/NetworkSystemExtension
      - path: Apps/SharedTunnelProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SPLITWAY_BUNDLE_ID_PREFIX).splitway.network-extension
        PRODUCT_NAME: $(PRODUCT_BUNDLE_IDENTIFIER)
        PRODUCT_MODULE_NAME: NetworkSystemExtension
        INFOPLIST_FILE: Apps/NetworkSystemExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: Apps/NetworkSystemExtension/NetworkSystemExtension.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
        INFOPLIST_KEY_CFBundleDisplayName: Splitway Network Extension
    dependencies:
      - package: SplitwayKit
        product: PacketTunnel
      - package: SplitwayKit
        product: PacketTunnelInfrastructure
      - package: SplitwayKit
        product: ProviderMessaging
      - package: SplitwayKit
        product: Diagnostics
      - package: SplitwayKit
        product: DiagnosticsInfrastructure
      - package: SplitwayKit
        product: SecretDelivery
      - package: SplitwayKit
        product: TransparentProxy
      - package: SplitwayKit
        product: TransparentProxyInfrastructure
      - package: SplitwayKit
        product: SecretDeliveryInfrastructure
      - package: SplitwayKit
        product: ServiceCatalog
      - package: SplitwayKit
        product: ServiceCatalogInfrastructure
      - package: TunnelCore
        product: TunnelCoreAdapter
schemes:
  iOSUITests:
    build:
      targets:
        iOSApp: all
        iOSUITests: [test]
    test:
      targets:
        - iOSUITests
