name: Feature request
description: Suggest a change or a new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like Splitway to do?
    validations:
      required: true
